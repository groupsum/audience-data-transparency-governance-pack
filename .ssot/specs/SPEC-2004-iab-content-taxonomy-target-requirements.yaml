body: |-
  ## Requirements
  
  IAB Content Taxonomy targets must be curated as contextual and content classification surfaces. Source records must preserve taxonomy identifiers, labels, hierarchy, version references, deprecated or changed categories when available, and mapping expectations for local contextual categories.
  
  ## Evidence
  
  The repository must map content taxonomy targets to downstream templates that require taxonomy source snapshots, contextual mapping tables, taxonomy version references, and ambiguous/unmapped category handling.
