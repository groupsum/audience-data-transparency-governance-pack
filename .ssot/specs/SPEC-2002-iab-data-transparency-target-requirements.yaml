body: |-
  ## Requirements
  
  IAB data transparency targets must be curated as disclosure, source/provider, collection method, permitted use, restriction, export, and audit evidence surfaces. Source curation must keep disclosure targets separate from audience taxonomy ID targets and content taxonomy ID targets.
  
  ## Evidence
  
  The repository must retain target metadata that justifies downstream templates for disclosure records, source/provider metadata, permitted-use checks, export disclosures, and audit evidence.
