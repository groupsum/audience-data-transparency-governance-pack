body: |-
  ## Requirements
  
  IAB Audience Taxonomy targets must be curated as audience segment classification surfaces. Source records must preserve taxonomy identifiers, labels, hierarchy, version references, deprecated or changed categories when available, and mapping expectations for local segment categories.
  
  ## Evidence
  
  The repository must map audience taxonomy targets to downstream templates that require taxonomy source snapshots, mapping tables, taxonomy version references, and ambiguous/unmapped category handling.
