body: |-
  ## Requirements
  
  This repository must curate audience data transparency targets only when they define audience data disclosure, provider/source metadata, taxonomy mapping, segment provenance, recency, permitted use, export transparency, clean-room input/output disclosure, or audit evidence expectations.
  
  Each curated target must record the authority owner, source title, source type, governed transparency capability, and version or publication date when available.
  
  The curated target set must include IAB Tech Lab Data Transparency Standard, IAB Tech Lab Audience Taxonomy, IAB Tech Lab Content Taxonomy, IAB Data Clean Rooms Guidance, and IAB measurement/data transparency materials where they govern audience data transparency.
  
  ## Exclusions
  
  The curation surface excludes customer identity schema, consent transport, general event telemetry, ad supply-chain transparency, and advertising measurement quality unless used only as contextual input for audience transparency.
