body: |-
  ## Context
  
  Audience transparency depends on knowing where segments came from, how recently they were refreshed, and how clean-room workflows disclose inputs and outputs.
  
  ## Decision
  
  Segment provenance, recency disclosure, IAB Data Clean Rooms Guidance, and ADMaP-adjacent measurement transparency materials are selected as authority inputs when they govern audience input/output transparency, freshness, permitted use, aggregation constraints, or measurement/activation disclosure.
