body: |-
  ## Context
  
  Audience segment classification needs a stable taxonomy authority for category identifiers, hierarchy, labels, and versioning.
  
  ## Decision
  
  IAB Tech Lab Audience Taxonomy is selected as the canonical authority source for audience segment classification targets. The repository must curate audience taxonomy identifiers, labels, hierarchy, version references, and mapping expectations separately from content taxonomy and data transparency disclosure requirements.
