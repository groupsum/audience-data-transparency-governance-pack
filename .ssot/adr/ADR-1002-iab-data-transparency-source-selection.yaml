body: |-
  ## Context
  
  Audience segment use requires disclosure of data sources, providers, collection methods, permitted uses, restrictions, and segment metadata.
  
  ## Decision
  
  IAB Tech Lab Data Transparency Standard and related data transparency materials are selected as canonical authority sources for audience data disclosure targets. These sources govern disclosure metadata and permitted-use representation rather than local segment modeling alone.
