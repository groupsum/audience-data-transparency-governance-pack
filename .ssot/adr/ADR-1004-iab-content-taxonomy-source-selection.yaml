body: |-
  ## Context
  
  Audience and advertising systems often use contextual/content classification alongside audience segment classification, but these are separate taxonomy surfaces.
  
  ## Decision
  
  IAB Tech Lab Content Taxonomy is selected as the canonical authority source for contextual and content classification targets. The repository must curate content taxonomy identifiers, labels, hierarchy, version references, and contextual mapping expectations separately from audience taxonomy targets.
